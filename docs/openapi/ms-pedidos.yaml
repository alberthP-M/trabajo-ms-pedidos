openapi: 3.0.0
paths:
  /v1/pedidos:
    post:
      operationId: PedidosController_create
      parameters:
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDto'
      responses:
        '201':
          description: Pedido pendiente con identificador, estado e historial
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - branchId
                  - items
                  - history
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - pendiente
                      - confirmado
                      - rechazado
                  branchId:
                    type: string
                  totalCents:
                    type: integer
                  currency:
                    type: string
                  rejectionReason:
                    type: string
                    nullable: true
                  correlationId:
                    type: string
                    format: uuid
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        quantity:
                          type: integer
                        unitPriceCents:
                          type: integer
                          nullable: true
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        toStatus:
                          type: string
                        reason:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        '400':
          description: Solicitud inválida o clave de idempotencia reutilizada
      security:
        - bearer: []
      summary: Crea un pedido idempotente
      tags:
        - pedidos
    get:
      operationId: PedidosController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    branchId:
                      type: string
                    status:
                      type: string
                    totalCents:
                      type: integer
                    createdAt:
                      type: string
                      format: date-time
      security:
        - bearer: []
      summary: Lista pedidos visibles para el usuario
      tags:
        - pedidos
  /v1/pedidos/{id}:
    get:
      operationId: PedidosController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - branchId
                  - items
                  - history
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - pendiente
                      - confirmado
                      - rechazado
                  branchId:
                    type: string
                  totalCents:
                    type: integer
                  currency:
                    type: string
                  rejectionReason:
                    type: string
                    nullable: true
                  correlationId:
                    type: string
                    format: uuid
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        quantity:
                          type: integer
                        unitPriceCents:
                          type: integer
                          nullable: true
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        toStatus:
                          type: string
                        reason:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: Pedido inexistente o fuera del alcance del usuario
      security:
        - bearer: []
      summary: Obtiene un pedido visible para el usuario con historial
      tags:
        - pedidos
  /health/live:
    get:
      operationId: HealthController_live
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Health
  /health/ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Health
info:
  title: Pedidos
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    OrderItemDto:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
          minimum: 1
      required:
        - productId
        - quantity
    CreateOrderDto:
      type: object
      properties:
        branchId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        paymentToken:
          type: string
          description: Token opaco de la pasarela, nunca datos de tarjeta
        currency:
          type: string
          default: BOB
      required:
        - branchId
        - items
        - paymentToken
